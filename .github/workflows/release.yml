name: Release

# Push a tag like v1.2.0 and this publishes the self-contained exe, builds
# the Inno Setup installer, and attaches both to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0). Leave empty to use the tag."
        required: false

permissions:
  contents: write

env:
  VIGEM_URL: https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe
  HIDHIDE_URL: https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not major.minor.patch" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v"

      - name: Publish self-contained exe
        shell: pwsh
        run: |
          dotnet publish src/WolverineRemapper/WolverineRemapper.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} -o dist
          Copy-Item dist/WolverineRemapper.exe "dist/WolverineRemapper-${{ steps.ver.outputs.version }}-portable.exe"

      - name: Download driver installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/deps | Out-Null
          Invoke-WebRequest $env:VIGEM_URL -OutFile installer/deps/ViGEmBus_Setup.exe
          Invoke-WebRequest $env:HIDHIDE_URL -OutFile installer/deps/HidHide_Setup.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist" "/DDepsDir=$PWD\installer\deps" `
            installer\WolverineRemapper.iss
          Get-ChildItem installer/output

      # The app's one-click updater verifies the installer against this file
      # (sha256sum format: "<hash>  <filename>") before running it.
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = @("installer/output/WolverineRemapper-Setup-$v.exe", "dist/WolverineRemapper-$v-portable.exe")
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Wolverine Remapper v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            installer/output/WolverineRemapper-Setup-${{ steps.ver.outputs.version }}.exe
            dist/WolverineRemapper-${{ steps.ver.outputs.version }}-portable.exe
            SHA256SUMS.txt
